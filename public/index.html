<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record Management System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        .admin-only { display: none; background: #eef; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        .card { border: 1px solid #ccc; padding: 15px; margin-top: 10px; border-radius: 5px; }
        select, button, input { padding: 8px; margin: 5px 0; }
        button { cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <h2>Record Management Dashboard</h2>

    <!-- Role Switcher (For Demo/Testing Purposes) -->
    <div>
        <label><b>Current Role:</b></label>
        <select id="roleSelect" onchange="switchRole()">
            <option value="user">User (View Only)</option>
            <option value="admin">Admin (Full Access)</option>
        </select>
    </div>

    <hr>

    <!-- Admin-Only Add Record Form -->
    <div id="adminFormSection" class="admin-only">
        <h3>Add New Record (Admin Access Only)</h3>
        <input type="text" id="recordTitle" placeholder="Enter Record Title"><br>
        <button onclick="addRecord()">Submit Record</button>
    </div>

    <!-- Public View -->
    <h3>Records List</h3>
    <div id="recordsList"></div>

    <script>
        let currentRole = 'user';

        function switchRole() {
            currentRole = document.getElementById('roleSelect').value;
            const adminSection = document.getElementById('adminFormSection');
            
            // ITAGO ANG ADD FORM KUNG HINDI ADMIN
            if (currentRole === 'admin') {
                adminSection.style.display = 'block';
            } else {
                adminSection.style.display = 'none';
            }
            fetchRecords();
        }

        async function fetchRecords() {
            const res = await fetch('/api/records');
            const data = await res.json();
            const listDiv = document.getElementById('recordsList');
            listDiv.innerHTML = data.map(r => `
                <div class="card">
                    <strong>#${r.id} - ${r.title}</strong> [${r.status}]
                </div>
            `).join('');
        }

        async function addRecord() {
            const title = document.getElementById('recordTitle').value;
            const res = await fetch('/api/records', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-user-role': currentRole // Sending current role in request header
                },
                body: JSON.stringify({ title })
            });

            const result = await res.json();
            if (res.ok) {
                alert(result.message);
                document.getElementById('recordTitle').value = '';
                fetchRecords();
            } else {
                alert('Error: ' + result.message);
            }
        }

        // Initialize UI
        switchRole();
    </script>
</body>
</html>
