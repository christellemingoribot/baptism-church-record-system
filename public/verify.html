<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Certificate Verification | Baptism Records</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(135deg,#eaf2fc,#f7faff);font:15px/1.6 Inter,Arial,sans-serif;color:#20344d}.card{width:min(560px,100%);background:#fff;border:1px solid #d9e6f5;border-radius:20px;padding:32px;box-shadow:0 18px 50px #143d7018;text-align:center}.mark{width:58px;height:58px;margin:auto;border-radius:17px;background:linear-gradient(135deg,#124d91,#082e5d);display:grid;place-items:center;color:#f4d99c;font-size:28px}.eyebrow{color:#b28a43;font-size:11px;font-weight:800;letter-spacing:2px;margin:18px 0 4px}h1{color:#103d70;margin:0 0 10px}.muted{color:#6e7f92}.result{margin-top:20px;padding:18px;border-radius:14px;background:#f2f7fd;text-align:left}.valid{border:1px solid #a9dec5;background:#effaf4}.invalid{border:1px solid #f0c5c5;background:#fff4f4}.row{padding:8px 0;border-bottom:1px solid #e5edf6}.row:last-child{border:0}a{color:#14589b}
</style></head><body><main class="card"><div class="mark">✦</div><p class="eyebrow">CHURCH RECORDS</p><h1>Certificate Verification</h1><p class="muted">This page checks whether a certificate number matches a record in the church registry.</p><div id="result" class="result">Checking certificate…</div><p class="muted" style="font-size:12px;margin-top:20px">A successful match confirms a registry entry. It does not replace confirmation from the issuing church.</p></main><script>
(async()=>{const box=document.getElementById('result'),number=new URLSearchParams(location.search).get('certificate');if(!number){box.className='result invalid';box.textContent='No certificate number was provided.';return;}try{const r=await fetch('/api/public/verify/'+encodeURIComponent(number)),d=await r.json();if(!r.ok||!d.valid){box.className='result invalid';box.innerHTML='<strong>✕ Certificate not found</strong><p>Please contact the issuing church for assistance.</p>';return;}box.className='result valid';const rows=[['Status','Valid registry match'],['Certificate No.',d.certificateNo],['Baptized person',[d.firstName,d.lastName].filter(Boolean).join(' ')],['Baptism date',d.baptismDate||'—'],['Church',d.church||'—']];box.innerHTML='<strong>✓ Registry record found</strong>'+rows.map(([k,v])=>'<div class="row"><small>'+k+'</small><br><strong>'+String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))+'</strong></div>').join('');}catch(e){box.className='result invalid';box.textContent='Verification is temporarily unavailable. Please try again later.';}})();
</script></body></html>
